version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin 439701543638.dkr.ecr.ap-southeast-1.amazonaws.com
      - REPOSITORY_URI=439701543638.dkr.ecr.ap-southeast-1.amazonaws.com/test
      - IMAGE_TAG=latest

  build:
    commands:
      - echo Building Docker image...
      - docker build -t test -f Dockerfile .
      - docker tag test:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Updating ECS task definition...
      - aws ecs describe-task-definition --task-definition Task --region ap-southeast-1 --query taskDefinition > taskdef.json
      - sed -i "s|\"image\": *\"[^\"]*\"|\"image\": \"$REPOSITORY_URI:$IMAGE_TAG\"|" taskdef.json
      - aws ecs register-task-definition --cli-input-json file://taskdef.json --region ap-southeast-1
      - aws ecs update-service --cluster ecs --service Service --task-definition Task --force-new-deployment --region ap-southeast-1

artifacts:
  files:
    - taskdef.json
